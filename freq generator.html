<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FG-2000 Function Generator</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:18px;
    background:
        radial-gradient(circle at 50% 10%,#454a50,#181a1e 45%,#070809);
    font-family:Arial,sans-serif;
    color:#ddd;
}

.instrument{
    width:min(1100px,100%);
    padding:18px;
    border:2px solid #555;
    border-radius:12px;
    background:linear-gradient(145deg,#34383d,#151719);
    box-shadow:
        0 25px 60px #000,
        inset 0 1px #888;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 5px 13px;
    margin-bottom:15px;
    border-bottom:1px solid #555;
}

.brand{
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;
}

.model{
    color:#999;
    font-family:monospace;
}

.panel{
    display:grid;
    grid-template-columns:1.25fr 1fr 1fr;
    gap:14px;
}

.section{
    padding:14px;
    border:1px solid #555;
    border-radius:8px;
    background:linear-gradient(#292d31,#191b1e);
    box-shadow:
        inset 0 1px #444,
        0 4px 8px #000;
}

.title{
    margin-bottom:12px;
    padding-bottom:7px;
    border-bottom:1px solid #484b50;
    color:#aaa;
    font-size:12px;
    letter-spacing:1.5px;
}

.display{
    padding:12px;
    margin-bottom:15px;
    text-align:right;
    border:4px solid #101010;
    border-radius:6px;
    background:#061008;
    box-shadow:
        inset 0 0 20px #000,
        0 0 0 1px #666;
}

.frequency{
    font-family:"Courier New",monospace;
    font-size:clamp(32px,5vw,54px);
    color:#65ff80;
    text-shadow:0 0 9px #25ff4b;
    white-space:nowrap;
}

.unit{
    color:#4fd267;
    font-family:monospace;
    font-size:13px;
    letter-spacing:2px;
}

.exact{
    margin-top:4px;
    color:#54b963;
    font-family:monospace;
    font-size:12px;
}

.knob-area{
    display:flex;
    justify-content:center;
    margin:8px 0 12px;
}

.knob{
    position:relative;
    width:150px;
    height:150px;
    border-radius:50%;
    cursor:grab;

    background:
        radial-gradient(
            circle at 35% 28%,
            #888 0%,
            #4b4b4b 17%,
            #222 50%,
            #090909 100%
        );

    border:5px solid #111;

    box-shadow:
        0 8px 16px #000,
        inset 0 2px 4px #aaa;
}

.knob::before{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    border:1px solid #777;
    border-bottom-color:#222;
}

.knob::after{
    content:"";
    position:absolute;
    left:50%;
    top:14px;
    width:4px;
    height:52px;
    border-radius:3px;
    background:#eee;

    transform:
        translateX(-50%)
        rotate(var(--rotation,-135deg));

    transform-origin:2px 61px;

    box-shadow:0 0 5px white;
}

.scale{
    display:flex;
    justify-content:space-between;
    padding:0 8px;
    color:#888;
    font-size:10px;
}

.wave-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

button{
    padding:10px 7px;
    border-radius:5px;
    border:1px solid #686d72;
    color:#ddd;
    font-weight:bold;

    background:linear-gradient(#484d53,#272b2f);

    box-shadow:
        inset 0 1px #888,
        0 2px 3px #000;

    cursor:pointer;
}

button:hover{
    filter:brightness(1.15);
}

button:active{
    transform:translateY(1px);
}

button.active{
    color:#fff2a0;
    border-color:#d5b63d;
    background:linear-gradient(#8d761d,#4d3c08);
}

.control{
    margin:15px 0;
}

.control label{
    display:flex;
    justify-content:space-between;
    margin-bottom:7px;
    color:#aaa;
    font-size:12px;
}

.value{
    color:#8cff9a;
    font-family:monospace;
}

input[type="range"]{
    width:100%;
    accent-color:#c3a72d;
    cursor:pointer;
}

.output{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-top:14px;
    padding:11px;

    border:1px solid #555;
    border-radius:5px;

    background:#0b0c0d;
}

.status{
    color:#777;
    font-family:monospace;
    font-size:12px;
}

.status.live{
    color:#65ff7b;
    text-shadow:0 0 8px #2aff4a;
}

.led{
    width:14px;
    height:14px;
    border-radius:50%;
    background:#300;
    box-shadow:inset 0 0 4px #000;
}

.led.on{
    background:#ff3925;
    box-shadow:
        0 0 12px #ff3020,
        inset 0 0 3px white;
}

.meter{
    height:12px;
    margin-top:7px;
    overflow:hidden;
    border:1px solid #555;
    border-radius:3px;
    background:#080808;
}

.meter-bar{
    width:0%;
    height:100%;
    background:
        linear-gradient(
            90deg,
            #35c84c 0%,
            #35c84c 65%,
            #e5d52c 66%,
            #e5d52c 85%,
            #e33 86%
        );
}

.bnc{
    width:58px;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;
    border:5px solid #777;

    background:
        radial-gradient(
            circle,
            #111 0 23%,
            #ddd 24% 30%,
            #222 31% 55%,
            #aaa 56% 61%,
            #111 62%
        );

    box-shadow:0 4px 8px #000;

    color:white;
    font-size:9px;
    font-weight:bold;
}

.bottom{
    display:flex;
    gap:10px;
    margin-top:14px;
}

.bottom button{
    flex:1;
}

.note{
    margin-top:12px;
    color:#888;
    font-size:11px;
    line-height:1.5;
}

@media(max-width:800px){

    .panel{
        grid-template-columns:1fr;
    }

    .knob{
        width:135px;
        height:135px;
    }

    .bottom{
        flex-wrap:wrap;
    }

    .bottom button{
        min-width:120px;
    }
}
</style>
</head>

<body>

<div class="instrument">

<div class="header">

    <div class="brand">
        FUNCTION GENERATOR
    </div>

    <div class="model">
        FG-2000 DIGITAL
    </div>

</div>


<div class="panel">

<!-- FREQUENCY -->

<section class="section">

<div class="title">
    FREQUENCY
</div>

<div class="display">

    <div
        class="frequency"
        id="frequencyDisplay">
        1.000
    </div>

    <div
        class="unit"
        id="frequencyUnit">
        kHz
    </div>

    <div
        class="exact"
        id="exactFrequency">
        1000 Hz
    </div>

</div>


<div class="knob-area">

    <div
        class="knob"
        id="frequencyKnob">
    </div>

</div>


<div class="scale">
    <span>0.1 Hz</span>
    <span>1 kHz</span>
    <span>20 kHz</span>
</div>


<div class="control">

<label>
    RANGE
    <span
        class="value"
        id="rangeValue">
        1 kHz
    </span>
</label>

<input
    id="range"
    type="range"
    min="0"
    max="6"
    step="1"
    value="4">

</div>


<div class="control">

<label>
    FINE
    <span
        class="value"
        id="fineValue">
        0%
    </span>
</label>

<input
    id="fine"
    type="range"
    min="-10"
    max="10"
    step="0.1"
    value="0">

</div>

</section>


<!-- WAVEFORM -->

<section class="section">

<div class="title">
    WAVEFORM
</div>


<div class="wave-buttons">

<button class="wave active" data-wave="sine">
    SINE
</button>

<button class="wave" data-wave="square">
    SQUARE
</button>

<button class="wave" data-wave="sawtooth">
    SAW
</button>

<button class="wave" data-wave="triangle">
    TRIANGLE
</button>

</div>


<div class="control">

<label>
    AMPLITUDE
    <span
        class="value"
        id="amplitudeValue">
        0.50 V
    </span>
</label>

<input
    id="amplitude"
    type="range"
    min="0"
    max="1"
    step="0.01"
    value="0.5">

</div>


<div class="control">

<label>
    DC OFFSET
    <span
        class="value"
        id="offsetValue">
        0.00 V
    </span>
</label>

<input
    id="offset"
    type="range"
    min="-1"
    max="1"
    step="0.01"
    value="0">

</div>


<div class="control">

<label>
    DUTY CYCLE
    <span
        class="value"
        id="dutyValue">
        50%
    </span>
</label>

<input
    id="duty"
    type="range"
    min="5"
    max="95"
    value="50">

</div>


<div class="output">

<div>

<div
    class="status"
    id="status">
    OUTPUT OFF
</div>

<div class="meter">

<div
    class="meter-bar"
    id="meter">
</div>

</div>

</div>

<div
    class="led"
    id="led">
</div>

</div>

</section>


<!-- OUTPUT -->

<section class="section">

<div class="title">
    OUTPUT / CONTROL
</div>


<button
    id="outputButton"
    style="width:100%;font-size:15px;padding:13px">

    OUTPUT OFF

</button>


<div class="control">

<label>
    OUTPUT LEVEL
    <span
        class="value"
        id="levelValue">
        100%
    </span>
</label>

<input
    id="level"
    type="range"
    min="0"
    max="1"
    step="0.01"
    value="1">

</div>


<div class="control">

<label>
    PHASE
    <span
        class="value"
        id="phaseValue">
        0°
    </span>
</label>

<input
    id="phase"
    type="range"
    min="0"
    max="360"
    value="0">

</div>


<div class="control">

<label>
    SMOOTHING
    <span
        class="value"
        id="filterValue">
        OFF
    </span>
</label>

<input
    id="filter"
    type="range"
    min="0"
    max="1"
    step="0.01"
    value="0">

</div>


<div class="output">

<div>

<b style="font-size:12px">
    50 Ω OUTPUT
</b>

<div class="note">
    Simulasi output audio.
</div>

</div>

<div class="bnc">
    OUT
</div>

</div>

</section>

</div>


<div class="bottom">

<button id="minus">
    − FREQ
</button>

<button id="plus">
    + FREQ
</button>

<button id="reset">
    RESET
</button>

<button id="mute">
    MUTE
</button>

</div>


<div class="note">
    Generator ini menghasilkan suara melalui speaker/headphone.
    BNC pada tampilan hanya simulasi dan bukan output tegangan listrik.
</div>

</div>


<script>

let audioContext=null;
let oscillator=null;
let gainNode=null;
let analyser=null;
let filterNode=null;

let running=false;
let muted=false;

let frequency=1000;
let waveform="sine";


/*
    RANGE:
    0.1 Hz
    1 Hz
    10 Hz
    100 Hz
    1 kHz
    10 kHz
    20 kHz
*/

const rangeSteps=[
    0.1,
    1,
    10,
    100,
    1000,
    10000,
    20000
];


function $(id){
    return document.getElementById(id);
}


function clamp(value,min,max){
    return Math.max(min,Math.min(max,value));
}


/* FORMAT */

function formatFrequency(f){

    if(f>=1000){

        return [
            (f/1000).toFixed(3),
            "kHz"
        ];

    }

    if(f<1){

        return [
            f.toFixed(3),
            "Hz"
        ];

    }

    return [
        f.toFixed(2),
        "Hz"
    ];
}


/* KNOB */

function updateKnob(){

    const min=0.1;
    const max=20000;

    const position=
        (
            Math.log10(frequency)-
            Math.log10(min)
        )/
        (
            Math.log10(max)-
            Math.log10(min)
        );

    const rotation=
        -135+
        position*270;

    $("frequencyKnob")
    .style
    .setProperty(
        "--rotation",
        rotation+"deg"
    );
}


/* UI */

function updateUI(){

    const f=
        formatFrequency(frequency);


    $("frequencyDisplay").textContent=
        f[0];

    $("frequencyUnit").textContent=
        f[1];

    $("exactFrequency").textContent=
        frequency<1
        ? frequency.toFixed(3)+" Hz"
        : Math.round(frequency)+" Hz";


    const r=
        rangeSteps[
            Number($("range").value)
        ];


    if(r>=1000){

        $("rangeValue").textContent=
            (r/1000)+" kHz";

    }else{

        $("rangeValue").textContent=
            r+" Hz";
    }


    $("fineValue").textContent=
        Number($("fine").value)
        .toFixed(1)+"%";


    $("amplitudeValue").textContent=
        Number($("amplitude").value)
        .toFixed(2)+" V";


    $("offsetValue").textContent=
        Number($("offset").value)
        .toFixed(2)+" V";


    $("dutyValue").textContent=
        $("duty").value+"%";


    $("levelValue").textContent=
        Math.round(
            Number($("level").value)*100
        )+"%";


    $("phaseValue").textContent=
        $("phase").value+"°";


    const filter=
        Number($("filter").value);

    $("filterValue").textContent=
        filter===0
        ?"OFF"
        :Math.round(filter*100)+"%";


    updateKnob();
}


/* AUDIO */

function actualFrequency(){

    const fine=
        1+
        Number($("fine").value)/100;

    return clamp(
        frequency*fine,
        0.1,
        20000
    );
}


function createAudio(){

    if(audioContext)
        return;


    audioContext=
        new(
            window.AudioContext||
            window.webkitAudioContext
        )();


    oscillator=
        audioContext.createOscillator();

    gainNode=
        audioContext.createGain();

    analyser=
        audioContext.createAnalyser();

    filterNode=
        audioContext.createBiquadFilter();


    analyser.fftSize=256;


    filterNode.type="lowpass";

    filterNode.frequency.value=20000;


    oscillator
        .connect(gainNode)
        .connect(filterNode)
        .connect(analyser)
        .connect(audioContext.destination);


    oscillator.start();


    oscillator.frequency.value=
        actualFrequency();


    gainNode.gain.value=0;
}


/* UPDATE AUDIO */

function updateAudio(){

    if(!audioContext)
        return;


    if(audioContext.state==="suspended"){
        audioContext.resume();
    }


    oscillator.type=
        waveform;


    oscillator.frequency
    .setTargetAtTime(
        actualFrequency(),
        audioContext.currentTime,
        0.01
    );


    const amplitude=
        Number($("amplitude").value);

    const level=
        Number($("level").value);


    const volume=
        running&&!muted
        ?amplitude*level
        :0;


    gainNode.gain
    .setTargetAtTime(
        volume,
        audioContext.currentTime,
        0.015
    );


    const smoothing=
        Number($("filter").value);


    filterNode.frequency.value=
        20000-
        Math.round(
            19900*smoothing
        );
}


/* OUTPUT */

function setOutput(state){

    running=state;


    $("outputButton").textContent=
        running
        ?"OUTPUT ON"
        :"OUTPUT OFF";


    $("status").textContent=
        running&&!muted
        ?"OUTPUT ACTIVE"
        :muted
        ?"MUTED"
        :"OUTPUT OFF";


    $("status")
    .classList
    .toggle(
        "live",
        running&&!muted
    );


    $("led")
    .classList
    .toggle(
        "on",
        running&&!muted
    );


    createAudio();

    updateAudio();
}


/* WAVEFORM */

document
.querySelectorAll(".wave")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            document
            .querySelectorAll(".wave")
            .forEach(
                b=>
                b.classList.remove("active")
            );


            button.classList.add("active");


            waveform=
                button.dataset.wave;


            updateAudio();
        }
    );

});


/* OUTPUT */

$("outputButton")
.addEventListener(
    "click",
    ()=>{
        setOutput(!running);
    }
);


/* MUTE */

$("mute")
.addEventListener(
    "click",
    ()=>{

        muted=!muted;


        $("mute").textContent=
            muted
            ?"UNMUTE"
            :"MUTE";


        updateAudio();


        $("status").textContent=
            muted
            ?"MUTED"
            :running
            ?"OUTPUT ACTIVE"
            :"OUTPUT OFF";


        $("led")
        .classList
        .toggle(
            "on",
            running&&!muted
        );
    }
);


/* RANGE */

$("range")
.addEventListener(
    "input",
    ()=>{

        const index=
            Number($("range").value);


        frequency=
            rangeSteps[index];


        updateUI();
        updateAudio();
    }
);


/* FINE */

$("fine")
.addEventListener(
    "input",
    ()=>{

        updateUI();
        updateAudio();
    }
);


/* CONTROLS */

[
    "amplitude",
    "offset",
    "level"
]
.forEach(id=>{

    $(id)
    .addEventListener(
        "input",
        ()=>{

            updateUI();
            updateAudio();
        }
    );

});


$("filter")
.addEventListener(
    "input",
    ()=>{
        updateUI();
        updateAudio();
    }
);


$("duty")
.addEventListener(
    "input",
    updateUI
);


$("phase")
.addEventListener(
    "input",
    updateUI
);


/* FREQUENCY BUTTON */

function changeFrequency(value){

    frequency=
        clamp(
            value,
            0.1,
            20000
        );


    let nearest=0;
    let distance=Infinity;


    rangeSteps.forEach(
        (step,index)=>{

            const d=
                Math.abs(
                    Math.log10(step)-
                    Math.log10(frequency)
                );


            if(d<distance){

                distance=d;
                nearest=index;

            }

        }
    );


    $("range").value=
        nearest;


    updateUI();
    updateAudio();
}


$("minus")
.addEventListener(
    "click",
    ()=>{
        changeFrequency(
            frequency/1.1
        );
    }
);


$("plus")
.addEventListener(
    "click",
    ()=>{
        changeFrequency(
            frequency*1.1
        );
    }
);


/* RESET */

$("reset")
.addEventListener(
    "click",
    ()=>{

        frequency=1000;
        waveform="sine";
        muted=false;


        $("range").value=4;
        $("fine").value=0;
        $("amplitude").value=.5;
        $("offset").value=0;
        $("duty").value=50;
        $("level").value=1;
        $("phase").value=0;
        $("filter").value=0;


        document
        .querySelectorAll(".wave")
        .forEach(
            b=>
            b.classList.toggle(
                "active",
                b.dataset.wave==="sine"
            )
        );


        $("mute").textContent="MUTE";


        updateUI();
        updateAudio();
    }
);


/* KNOB DRAG */

let dragging=false;
let lastY=0;


$("frequencyKnob")
.addEventListener(
    "pointerdown",
    event=>{

        dragging=true;
        lastY=event.clientY;


        $("frequencyKnob")
        .setPointerCapture(
            event.pointerId
        );
    }
);


$("frequencyKnob")
.addEventListener(
    "pointermove",
    event=>{

        if(!dragging)
            return;


        const dy=
            lastY-event.clientY;


        lastY=
            event.clientY;


        frequency*=
            Math.pow(
                10,
                dy/240
            );


        changeFrequency(
            frequency
        );
    }
);


$("frequencyKnob")
.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);


$("frequencyKnob")
.addEventListener(
    "pointercancel",
    ()=>{
        dragging=false;
    }
);


/* METER */

const meterData=
    new Uint8Array(128);


function meterLoop(){

    requestAnimationFrame(
        meterLoop
    );


    if(
        analyser&&
        running&&
        !muted
    ){

        analyser
        .getByteTimeDomainData(
            meterData
        );


        let total=0;


        for(
            let i=0;
            i<meterData.length;
            i++
        ){

            const x=
                (meterData[i]-128)/128;


            total+=x*x;
        }


        const rms=
            Math.sqrt(
                total/meterData.length
            );


        $("meter").style.width=
            Math.min(
                100,
                rms*180
            )+"%";

    }else{

        $("meter").style.width="0%";
    }
}


updateUI();

meterLoop();

</script>

</body>
</html>
